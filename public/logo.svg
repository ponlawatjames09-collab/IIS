<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="s-mask">
      <rect width="500" height="500" fill="white" />
      <text x="250" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="bold" text-anchor="middle" fill="black" stroke="black" stroke-width="32" stroke-linejoin="round">S</text>
    </mask>
  </defs>

  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#D58128" stroke-width="28"/>

  <!-- Background 'I's -->
  <g mask="url(#s-mask)" fill="#D58128">
    <text x="155" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="280" font-weight="bold" text-anchor="middle">I</text>
    <text x="345" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="280" font-weight="bold" text-anchor="middle">I</text>
  </g>

  <!-- Foreground 'S' -->
  <text x="250" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="bold" text-anchor="middle" fill="#D58128">S</text>
</svg>
